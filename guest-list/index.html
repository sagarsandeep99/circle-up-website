<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircleUp | Guest Form</title>
    
    <!-- Instant Redirect Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=https://forms.gle/zAsHUNHcTpocX5T5A">
    
    <!-- WhatsApp & Social Media Preview Cards -->
    <meta property="og:title" content="CircleUp Guest Form ✨">
    <meta property="og:description" content="Fill out the guest form to join us for an upcoming CircleUp experience.">
    <meta property="og:url" content="https://circleupirl.com/guest-list">
    
    <!-- Dynamic Title Sync & JavaScript Fallback Redirect -->
    <script>
        // Fetch title dynamically from event-details.json
        fetch('../pay-up-at-circleup/event-details.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                if (data && data.guestFormName) {
                    document.title = data.guestFormName;
                }
            })
            .catch(err => {
                console.error('Error fetching guestFormName from JSON:', err);
            })
            .finally(() => {
                // Ensure redirect executes reliably after title resolution
                window.location.href = "https://forms.gle/zAsHUNHcTpocX5T5A";
            });
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://forms.gle/zAsHUNHcTpocX5T5A">click here</a>.</p>
</body>
</html>
