<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 
      ==========================================================================
      CIRCLEUP EVENT CONFIGURATION
      Update these 4 items whenever you launch a new event link:
      ==========================================================================
      1. Line 18 (<title>):                   Browser tab title
      2. Line 21 (<meta property="og:title">): WhatsApp & Social preview title
      3. Line 27 (<meta http-equiv="refresh">): Primary Google Form redirect URL
      4. Line 35 (const GOOGLE_FORM_URL):      Fallback JavaScript redirect URL
      ==========================================================================
    -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. BROWSER TAB TITLE -->
    <title>CircleUp | Halloween Guest Form</title>

    <!-- 2. WHATSAPP & SOCIAL MEDIA PREVIEW CARD TITLE -->
    <meta property="og:title" content="CircleUp | Halloween Guest Form">
    
    <!-- CANONICAL URL REFERENCE -->
    <meta property="og:url" content="https://circleupirl.com/guest-list">

    <!-- 3. PRIMARY GOOGLE FORM REDIRECT -->
    <meta http-equiv="refresh" content="0; url=https://forms.gle/zAsHUNHcTpocX5T5A">

    <!-- 4. FALLBACK JAVASCRIPT REDIRECT -->
    <script>
        const GOOGLE_FORM_URL = "https://forms.gle/zAsHUNHcTpocX5T5A";
        window.location.href = GOOGLE_FORM_URL;
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://forms.gle/zAsHUNHcTpocX5T5A">click here</a>.</p>
</body>
</html>
